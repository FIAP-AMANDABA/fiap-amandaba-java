spring.application.name=auth
spring.jpa.hibernate.ddl-auto=none

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT
app.jwt.secret=amandaba-chave-local-para-testes-2026-nao-publicar
app.jwt.issuer=amandaba-java
app.jwt.audience=amandaba-apis
app.jwt.validity-ms=3600000

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

debug=false
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO

# Frontends locais autorizados; ajuste FRONTEND_ORIGINS no deploy.
app.cors.origins=${FRONTEND_ORIGINS:http://localhost:8080,http://localhost:8081,http://localhost:19006}
