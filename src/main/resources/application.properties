spring.application.name=auth
server.port=${PORT:8080}

# DATABASE
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.ignore-migration-patterns=*:ignored

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=amandaba-java
app.jwt.audience=amandaba-apis
app.jwt.validity-ms=3600000

# CORS (ajuste FRONTEND_ORIGINS no deploy)
app.cors.origins=${FRONTEND_ORIGINS:http://localhost:8080,http://localhost:8081,http://localhost:19006}

# LOGS
debug=false
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO